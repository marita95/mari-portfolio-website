# --- Site settings -----------------------------------------------------------
title: Mari M.
tagline: A portfolio website.
description: A portfolio website.
author: Mari M.
lang: en-GB

# Production URL. With the custom domain at the apex, keep baseurl empty.
url: "https://mari.im"
baseurl: ""

# --- Contact form ------------------------------------------------------------
# The form posts to a third-party form service, which holds the destination
# address on its own servers. That keeps the address out of this repo and out
# of the published HTML, so scrapers never see it.
# The form only renders once `endpoint` is set, so the page never shows a
# broken form. `access_key` is only needed by some providers (e.g. Web3Forms).
contact:
  endpoint: ""
  access_key: ""

# --- Collections -------------------------------------------------------------
collections:
  galleries:
    output: true
    permalink: /:name/
  # Substack posts, refreshed daily by tools/fetch_substack.py. output: false
  # means no pages are generated for them — they only appear in the /blog/
  # list, linking straight to Substack.
  substack:
    output: false

# Blog posts keep the original /yyyy/mm/dd/title/ permalink shape.
permalink: /:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: galleries }
    values: { layout: gallery }
  - scope: { path: "", type: posts }
    values: { layout: post }

# --- Build -------------------------------------------------------------------
markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
  - .sass-cache
